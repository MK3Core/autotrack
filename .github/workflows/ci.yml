name: CI

# Type-checks, lints and builds every pull request (including Dependabot's
# security fixes) and every push to main, so a dependency bump that breaks the
# app shows up as a failed check before it's merged.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check + bundle)
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
